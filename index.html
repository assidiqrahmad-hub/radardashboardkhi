<!doctype html>

  <head>
    <script>
      // In AI Studio Build sandbox environment, HMR is disabled (DISABLE_HMR=true).
      // Intercept Vite HMR WebSocket connection to prevent unhandled rejection errors.
      (function() {
        const NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        class ViteHmrMockSocket extends EventTarget {
          constructor() {
            super();
            this.readyState = 1; // WebSocket.OPEN
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.url = '';
            this.protocol = 'vite-hmr';
            this.bufferedAmount = 0;
            this.binaryType = 'blob';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;
          }
          send() {}
          close() {
            this.readyState = 3;
          }
        }

        window.WebSocket = function(url, protocols) {
          if (
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping')))
          ) {
            return new ViteHmrMockSocket();
          }
          return new NativeWebSocket(url, protocols);
        };

        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        window.WebSocket.OPEN = NativeWebSocket.OPEN;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED;

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (String(event.reason.message || event.reason).includes('WebSocket') ||
             String(event.reason.stack || '').includes('@vite/client'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
